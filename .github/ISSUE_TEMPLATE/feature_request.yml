name: 功能建议 / Feature request
description: 描述你希望改善的使用场景 / Describe a workflow you would like to improve.
title: "[Feature] "
body:
  - type: markdown
    attributes:
      value: 请先搜索已有 Issues，避免重复建议。请勿提交私人会话或登录资料 / Search existing issues first. Do not include private conversations or login data.
  - type: textarea
    id: problem
    attributes:
      label: 想解决的问题 / Problem to solve
      description: 说明具体使用场景与当前不方便的地方 / Describe the situation and what is inconvenient today.
    validations:
      required: true
  - type: textarea
    id: suggestion
    attributes:
      label: 期望的改善 / Suggested improvement
      description: 描述理想的操作或结果 / Describe the desired interaction or result.
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: 当前替代办法或参考 / Workarounds or references
      description: 可选；截图与链接请先检查是否含敏感信息 / Optional; check screenshots and links for sensitive information.
